<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adicionar novo livro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>
    <h2>Adicionar livro</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category  }}" > {{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

    <form action="criar" method="post" enctype="multipart/form-data">

         <label> Capa do livro </label>
        <input  name="imagem" id="imagem" placeholder="Insira o título do livro" type="file" accept="jpg">

        <label> Título </label>
        <input  name="titulo" placeholder="Insira o título do livro" required type="text">

        <label> Autor</label>
        <input name="autor" placeholder="Insira o nome do autor" required type="text">

        <label > Ano de Publicação </label>
        <input name="ano_publicacao" placeholder="Insira o ano de publicação" required type="number">

        <button type="submit"> Enviar </button>
    </form>
</body>
</html>
