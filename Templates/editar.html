<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar um livro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>
    <h2>Deletar livro</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category  }}" > {{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

    <form action="{{ url_for('editar', id=livro[0]) }}" method="post">
        <label> Título </label>
        <input  name="titulo" placeholder="Insira o título do livro" required type="text" value="{{ livro[1] }}">

        <label> Autor</label>
        <input name="autor" placeholder="Insira o nome do autor" required type="text" value="{{ livro[2] }}">

        <label > Ano de Publicação </label>
        <input name="ano_publicacao" placeholder="Insira o ano de publicação" required type="number" value="{{ livro[3] }}">

        <button type="submit"> Enviar </button>
    </form>
</body>
</html>
