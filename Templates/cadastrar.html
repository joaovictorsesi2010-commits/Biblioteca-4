<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cadastro do usuário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>
    <h2>Cadastrar</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category  }}" > {{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

    <form action="cadastrar" method="post">
        <label> Nome </label>
        <input name="nome" placeholder="Insira seu nome" required type="text">

        <label> Senha</label>
        <input name="senha" placeholder="Insira sua senha" required type="password">

        <label > Ano de Publicação </label>
        <input name="email" placeholder="Insira seu email" required type="email">

        <button type="submit"> Enviar </button>
    </form>
</body>
</html>
